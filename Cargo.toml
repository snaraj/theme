[workspace]
members = ["crates/pigment"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/snaraj/theme"

# AGENTS.md: deny(unsafe_code) wired as workspace lints so the gate enforces
# it; every crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "deny"

[package]
name = "theme"
version = "0.3.5"
description = "One command that owns the desktop wallpaper and the terminal palette together"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
pigment = { path = "crates/pigment" }
# Same crate and feature set pigment already pins — transforms, dimension
# reads and content decodes reuse it rather than shelling to sips/magick.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
    "bmp",
    "tiff",
] }
# The descriptor-bound saver needs openat/O_NOFOLLOW/fstat-by-fd, which std
# does not expose; rustix is the safe binding that keeps deny(unsafe_code)
# intact (raw libc would need unsafe in this crate). `system` is uname(2),
# which the bare screen's OS line reads instead of spawning uname(1).
rustix = { version = "1", default-features = false, features = ["fs", "process", "std", "system", "termios"] }
# `theme update` verifies a release download against SHA256SUMS before it
# may replace the running binary. In-process (RustCrypto) rather than
# shelling to shasum/sha256sum: a PATH-resolved tool must not be the
# integrity check for executable replacement, and the two platform tools
# differ anyway.
sha2 = { version = "0.10", default-features = false, features = ["std"] }
# Same principle one step further down the chain: the release tarball is
# unpacked in-process (pure-Rust gzip; the strict single-member tar walk is
# in-house) so no PATH-resolved tar can sit between the verified bytes and
# the installed binary.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# `theme list | head` must end quietly: Rust ignores SIGPIPE before main and
# println! panics on EPIPE (#59). rustix has no safe binding for signal
# dispositions and this workspace keeps deny(unsafe_code), so the one
# signal(SIGPIPE, SIG_DFL) call comes from this ten-line wrapper over libc,
# which is already in the graph through rustix.
sigpipe = "0.1.3"
