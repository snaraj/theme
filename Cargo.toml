[workspace]
members = ["crates/pigment"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/snaraj/theme"

# AGENTS.md: deny(unsafe_code) wired as workspace lints so the gate enforces
# it; every crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "deny"

[package]
name = "theme"
version = "0.1.0"
description = "One command that owns the desktop wallpaper and the terminal palette together"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
pigment = { path = "crates/pigment" }
# Same crate and feature set pigment already pins — transforms, dimension
# reads and content decodes reuse it rather than shelling to sips/magick.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
    "bmp",
    "tiff",
] }
# The descriptor-bound saver needs openat/O_NOFOLLOW/fstat-by-fd, which std
# does not expose; rustix is the safe binding that keeps deny(unsafe_code)
# intact (raw libc would need unsafe in this crate).
rustix = { version = "1", default-features = false, features = ["fs", "process", "std"] }
