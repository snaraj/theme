name: release

# Standalone release chain: a release is an immutable v*.*.* tag on main,
# published after successful CI with prepared binaries, packages and checksums.
# A dispatch on main uses the same source and CI proof. Other branch
# dispatches build and install without publishing.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# One group per COMMIT, not per ref: GitHub keeps a single pending run per
# group, so grouping main pushes by ref would let a third version-moving
# merge cancel the second's pending run and drop that version from the
# ledger. A dispatch on the same commit still queues behind it.
concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # One version, one decision, one summary line, before any runner minute
  # goes to the matrix: the version in Cargo.toml is the release claim, so a
  # merge that moves it publishes, and a merge that does not costs this job
  # alone.
  slot:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.slot.outputs.version }}
      publish: ${{ steps.slot.outputs.publish }}
      source_sha: ${{ steps.authorize.outputs.source_sha }}
      authorized: ${{ steps.authorize.outputs.authorized }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B .github/scripts/authorize_release.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.authorize.outputs.source_sha }}
          persist-credentials: false
      - id: slot
        env:
          AUTHORIZED: ${{ steps.authorize.outputs.authorized }}
          SOURCE_SHA: ${{ steps.authorize.outputs.source_sha }}
        run: |
          VER=$(cargo pkgid --offline | sed 's/.*[#@]//')
          echo "$VER" | grep -qxE '[0-9]+\.[0-9]+\.[0-9]+' || { echo "::error::cannot read the crate version off Cargo.toml (got '$VER')"; exit 1; }
          case "$AUTHORIZED" in
            true)
              # Only an ANSWER decides: ls-remote exits 0 (tag exists), 2 (no
              # such tag), anything else (could not ask) — and a failed ask
              # must never read as permission to publish.
              git ls-remote --exit-code origin "refs/tags/v$VER" >/dev/null && rc=0 || rc=$?
              case "$rc" in
                0) publish=false; why="v$VER is already released: nothing to publish (bump the version in Cargo.toml to release again)" ;;
                2) publish=true; why="releasing v$VER from protected main at ${SOURCE_SHA:0:7}" ;;
                *) echo "::error::could not ask origin whether tag v$VER exists (git ls-remote exit $rc)"; exit 1 ;;
              esac ;;
            false)
              publish=false; why="dry run on $GITHUB_REF_NAME: v$VER is built and installed, nothing is published" ;;
            *) echo "::error::missing publication decision"; exit 1 ;;
          esac
          echo "version=$VER" >>"$GITHUB_OUTPUT"
          echo "publish=$publish" >>"$GITHUB_OUTPUT"
          echo "$why" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: build-${{ matrix.target }}
    needs: slot
    # Build once before review; main promotes the digest-pinned bytes unchanged.
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          # The Linux legs build on the OLDEST image still offered, never
          # the newest: a glibc symbol version is a floor the binary
          # inherits from its build host, and 24.04 stamped an unflagged
          # GLIBC_2.39 verneed (std's weak pidfd probe) that makes the
          # loader refuse on 22.04 and Debian 12. Do not "modernize" these.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            deb: amd64
            rpm: x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            deb: arm64
            rpm: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/../theme-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.slot.outputs.source_sha }}
          persist-credentials: false
      - name: Isolate compilation from generated release metadata and Git history
        id: export
        working-directory: ${{ github.workspace }}
        run: |
          mkdir "$GITHUB_WORKSPACE/../theme-source"
          git archive HEAD | tar --exclude=Formula/theme.rb --exclude=.github/release-preparation.json -xf - -C "$GITHUB_WORKSPACE/../theme-source"
          if git -C "$GITHUB_WORKSPACE/../theme-source" rev-parse --show-toplevel >/dev/null 2>&1; then
            echo "::error::exported source can still discover Git history"; exit 1
          fi
          echo "directory=$(cd "$GITHUB_WORKSPACE/../theme-source" && pwd -P)" >> "$GITHUB_OUTPUT"
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - if: runner.os == 'macOS'
        run: sh tests/portable-smoke.sh "$PWD/target/${{ matrix.target }}/release/theme"
      - run: tar -C target/${{ matrix.target }}/release -czf theme-${{ matrix.target }}.tar.gz theme
      # Distro packages beside the tarball, built by the runner's OWN distro
      # tools — nothing third-party sits in the packaging path. Their names
      # carry the version, never a target triple, so `theme update` still
      # finds exactly one asset.
      - if: matrix.deb != ''
        env:
          BIN: target/${{ matrix.target }}/release/theme
          DEB: ${{ matrix.deb }}
          RPM: ${{ matrix.rpm }}
          VER: ${{ needs.slot.outputs.version }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm binutils
          # The glibc floor read OFF THE BINARY, never hardcoded: apt has to
          # refuse on an old distro, not install a command that cannot run.
          LIBC=$(objdump -T "$BIN" | sed -n 's/.*GLIBC_\([0-9.]*\).*/\1/p' | sort -uV | tail -1)
          install -D -m755 "$BIN" pkg/usr/bin/theme && mkdir -p pkg/DEBIAN
          cat >pkg/DEBIAN/control <<EOF
          Package: theme
          Version: $VER
          Architecture: $DEB
          Depends: libc6 (>= $LIBC)
          Maintainer: Samuel Naranjo <39077795+snaraj@users.noreply.github.com>
          Homepage: https://github.com/snaraj/theme
          Section: utils
          Priority: optional
          Description: Wallpaper and terminal palette driven by one command
           The background image drives the desktop and the terminal together.
          EOF
          dpkg-deb --build --root-owner-group pkg "theme_${VER}_${DEB}.deb"
          install -D -m755 "$BIN" rpmroot/BUILDROOT/usr/bin/theme
          cat >theme.spec <<EOF
          Name: theme
          Version: $VER
          Release: 1
          Summary: Wallpaper and terminal palette driven by one command
          License: MIT
          URL: https://github.com/snaraj/theme
          BuildArch: $RPM
          %description
          The background image drives the desktop and the terminal together.
          %files
          /usr/bin/theme
          EOF
          rpmbuild -bb --define "_topdir $PWD/rpmroot" --buildroot "$PWD/rpmroot/BUILDROOT" theme.spec
          mv "rpmroot/RPMS/$RPM/theme-$VER-1.$RPM.rpm" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: theme-${{ matrix.target }}
          path: |
            ${{ steps.export.outputs.directory }}/theme-${{ matrix.target }}.tar.gz
            ${{ steps.export.outputs.directory }}/theme_*.deb
            ${{ steps.export.outputs.directory }}/theme-*.rpm
          if-no-files-found: error
          retention-days: 90

  # Nothing ships that has not been installed and run. The packages go in
  # through the real package managers — offline, artifact mounted
  # read-only — on the runner itself (Ubuntu 22.04 IS the glibc floor) and
  # in three distro images. Those images are the only third-party artifact
  # in the release path, so each is pinned by manifest-list digest with the
  # tag it was resolved from beside it.
  smoke:
    name: smoke-${{ matrix.target }}
    needs: [slot, build]
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.slot.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: theme-${{ matrix.target }}
      - env:
          VER: ${{ needs.slot.outputs.version }}
        run: |
          # The package manager is asked what version it installed and the
          # binary what version it is; both must be the crate's.
          cat >check.sh <<'EOF'
          set -eu
          export THEME_NO_UPDATE_CHECK=1 THEME_NO_APPLY=1 THEME_CACHE_DIR=/tmp/tc
          theme version
          theme version | grep -qx "version: v$VER"
          theme help >/dev/null
          sh "$(dirname "$0")/tests/portable-smoke.sh" "$(command -v theme)"
          EOF
          sudo apt-get install -y ./theme_*.deb
          dpkg -s theme | grep -qx "Version: $VER"
          sh check.sh
          # shellcheck disable=SC2016 # $VER is for the container's shell, via -e
          deb='apt-get install -y /pkg/theme_*.deb && dpkg -s theme | grep -qx "Version: $VER" && sh /pkg/check.sh'
          # shellcheck disable=SC2016 # same: expanded inside the container
          rpm='dnf -y --disablerepo="*" install /pkg/theme-*.rpm && rpm -q theme | grep -q "^theme-$VER-1\." && sh /pkg/check.sh'
          box() { docker run --rm --network none -e VER="$VER" -e DEBIAN_FRONTEND=noninteractive -v "$PWD:/pkg:ro" "$@"; }
          box debian:12@sha256:6ebd97fa83deb272194a2cf015b3d26a4d538e9ad3a7a79d544c8af5b0a01443 sh -c "$deb" # debian:12
          box ubuntu:22.04@sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc sh -c "$deb" # ubuntu:22.04
          box ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3 sh -c "$deb" # ubuntu:24.04
          box fedora:latest@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 sh -c "$rpm" # fedora:latest

  # Exact-main CI remains the publication authority. The preparation receipt
  # additionally proves matching source and the reviewed binary/package hashes.
  publish:
    if: needs.slot.outputs.publish == 'true'
    needs: slot
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      TAG: v${{ needs.slot.outputs.version }}
      SOURCE_SHA: ${{ needs.slot.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.slot.outputs.source_sha }}
          persist-credentials: false
      - name: Verify the prepared source, containers, payloads and Homebrew pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B .github/scripts/prepared_release.py verify --output prepared
      # Tarball names stay version-free: `releases/latest/download/<name>`
      # needs a stable name. One checksum file over EVERY asset — the deb
      # and the rpm carry no signature, so this over TLS is their integrity.
      - run: cd prepared && sha256sum --check SHA256SUMS
      # Resume-safe: a rerun after a failed release step finds its own tag
      # on this commit and goes on — the commits API peels the tag, so a
      # signed annotated tag pushed by hand counts too. A version that has
      # already shipped from this commit's own LINE OF HISTORY — an
      # ancestor or a descendant — is not an error: two merges seconds apart
      # race here (slot cannot see a tag the other run has not created yet),
      # either one can lose, and the loser did not move the version, so it
      # says so in the summary and ends green. A tag on a diverged commit is
      # still refused with the fix named — the tag ruleset would refuse to
      # move it anyway. Only the POST's own "already exists" means the tag
      # is there; any other failure is reported as itself (run 33901998634:
      # a transient 403 was read as a ledger conflict).
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$TAG" | grep -qxE 'v[0-9]+\.[0-9]+\.[0-9]+' || { echo "::error::no crate version reached publish ('$TAG')"; exit 1; }
          shipped() { # the existing tag sits on this commit's line of history
            gh api "repos/$GITHUB_REPOSITORY/compare/$TAG...$SOURCE_SHA" --jq .status 2>/dev/null | grep -qxE 'ahead|identical|behind'
          }
          nothing() { echo "$TAG already shipped from $(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha[0:7]'), on this commit's line of history: nothing to publish" | tee -a "$GITHUB_STEP_SUMMARY"; echo "go=false" >>"$GITHUB_OUTPUT"; exit 0; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            shipped && nothing
            echo "::error::$TAG is already released from a diverged commit: bump the version in Cargo.toml and merge"; exit 1
          fi
          if out=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SOURCE_SHA" 2>&1); then
            echo "go=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          grep -q 'Reference already exists' <<<"$out" || { echo "::error::could not create tag $TAG: $out"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha | grep -qx "$SOURCE_SHA" && { echo "go=true" >>"$GITHUB_OUTPUT"; exit 0; }
          shipped && nothing
          echo "::error::$TAG already exists on a diverged commit: bump the version in Cargo.toml"; exit 1
      - if: steps.tag.outputs.go == 'true'
        working-directory: prepared
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY"
          --verify-tag --title "theme $TAG"
          --generate-notes theme-*.tar.gz theme_*.deb theme-*.rpm SHA256SUMS

  # Verify public bytes and the same-merge formula after publication. An
  # already-released version is rechecked without rebuilding or republishing.
  distribution:
    needs: [slot, publish]
    if: >-
      always() && needs.slot.result == 'success' && needs.slot.outputs.authorized == 'true' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.slot.outputs.source_sha }}
          persist-credentials: false
      - name: Verify delivery through GitHub and Homebrew
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.slot.outputs.version }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          python3 -I -B .github/scripts/verify_distribution.py --tag "$TAG"
          brew trust --formula snaraj/theme/theme
          brew tap snaraj/theme "$GITHUB_WORKSPACE"
          brew install snaraj/theme/theme
          brew test snaraj/theme/theme
          sh tests/portable-smoke.sh "$(brew --prefix)/bin/theme"
          python3 -I -B tests/browser_cli_test.py "$(brew --prefix)/bin/theme"
          python3 -I -B tests/mdls_cli_test.py "$(brew --prefix)/bin/theme"
          python3 -I -B tests/preview_cli_test.py "$(brew --prefix)/bin/theme"
          python3 -I -B tests/cli_maintenance_test.py "$(brew --prefix)/bin/theme"
          echo "PUBLISHED_DELIVERY=PASS $TAG" >> "$GITHUB_STEP_SUMMARY"
