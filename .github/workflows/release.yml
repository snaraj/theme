name: release

# Standalone release chain: an immutable v*.*.* tag on main builds binaries
# for every supported target and publishes them as a GitHub Release with
# checksums. No coupling to anything outside this repository. The
# workflow_dispatch path is the pre-tag proof: it runs the full build matrix
# and skips publishing.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: tar -C target/${{ matrix.target }}/release -czf theme-${{ matrix.target }}.tar.gz theme
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: theme-${{ matrix.target }}
          path: theme-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
      # Asset names stay version-free: `releases/latest/download/<name>`
      # needs a stable name, and the release itself carries the version.
      - run: sha256sum theme-*.tar.gz > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          --verify-tag --title "theme $GITHUB_REF_NAME"
          --generate-notes theme-*.tar.gz SHA256SUMS
