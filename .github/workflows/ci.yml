name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      baseline:
        description: Full base commit SHA for the performance comparison
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # a hung test must cost minutes of feedback, not 6h
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -I -B tests/release_policy_test.py
      - run: python3 -I -B tests/distribution_test.py
      - run: python3 -I -B tests/prepared_release_test.py
      - run: python3 -I -B tests/kitty_pixels_test.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The acceptance fixture had never run anywhere but the author's Mac,
      # so nothing pinned the tool END TO END on the platform most of its
      # users are on. It needs both binaries — the update sections drive the
      # debug build's THEME_CURL seam — and costs this job seconds.
      - run: cargo build --release --locked && cargo build --locked && THEME_BIN=target/release/theme tests/boundary.sh
      - run: python3 -I -B tests/preview_cli_test.py target/release/theme
      - run: python3 -I -B tests/cli_maintenance_test.py target/release/theme
      - name: Compare command performance and rendering with the base commit
        env:
          THEME_PERF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.baseline }}
        run: tests/performance-ci.sh
      - name: Publish command timing and rendering evidence
        id: performance_artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: command-performance-${{ runner.os }}-${{ runner.arch }}
          path: target/performance/
          if-no-files-found: error
          retention-days: 30
      - name: Link command evidence in the job summary
        if: ${{ always() && steps.performance_artifact.outputs.artifact-url != '' }}
        env:
          ARTIFACT_URL: ${{ steps.performance_artifact.outputs.artifact-url }}
        run: |
          printf '\n[Download command-performance-%s-%s](%s)\n\nOpen results.json, report.md, and rendering.html inside this downloaded artifact.\n' "$RUNNER_OS" "$RUNNER_ARCH" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  # The browser's keys, pressed in a terminal that draws. The PTY tests prove
  # the bytes; only a real Kitty proves the whole path — raw mode, the key
  # parser, the redraw and the thumbnails — on a machine that is not the
  # author's. Kitty is pinned by version AND digest, verified before it is
  # extracted, and everything runs headless under Xvfb with software GL.
  browser-kitty:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # a hung terminal must cost minutes, not 6h
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the X server, software GL and the screen capture tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth imagemagick \
            libgl1 libgl1-mesa-dri libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 fonts-dejavu-core libx11-6 libxcb1 libxrandr2 \
            libxi6 libxcursor1 libxinerama1 libwayland-client0 libdbus-1-3 libcanberra0
      - name: Verify the pinned Kitty before extracting it
        env:
          KITTY_VERSION: 0.48.2
          KITTY_SHA256: 967a1958e7fc67b495d279c0963bcd1a0482097151817ce6506fabc822689af7
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kitty.txz" \
            "https://github.com/kovidgoyal/kitty/releases/download/v$KITTY_VERSION/kitty-$KITTY_VERSION-x86_64.txz"
          printf '%s  %s\n' "$KITTY_SHA256" "$RUNNER_TEMP/kitty.txz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/kitty"
          tar -xJf "$RUNNER_TEMP/kitty.txz" -C "$RUNNER_TEMP/kitty"
      - name: Verify current-source previews and browser keys in a real Kitty
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          cargo install --path . --locked --root target/source --target-dir target
          xvfb-run -a -s "-screen 0 1400x900x24" python3 -I -B tests/kitty_e2e.py \
            --kitty "$RUNNER_TEMP/kitty/bin/kitty" \
            --theme target/source/bin/theme --output target/kitty-e2e/source
      - name: Install the verified published or prepared Linux release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I -B .github/scripts/prepared_release.py install \
            --target x86_64-unknown-linux-gnu --output target/installed/bin --tests-output target/release-tests
          sh target/release-tests/portable-smoke.sh "$PWD/target/installed/bin/theme"
      - name: Verify installed previews and browser keys in a real Kitty
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s "-screen 0 1400x900x24" python3 -I -B target/release-tests/kitty_e2e.py \
            --kitty "$RUNNER_TEMP/kitty/bin/kitty" \
            --theme "$PWD/target/installed/bin/theme" --output target/kitty-e2e/installed
      - name: Prove dropped graphics and colors fail the same terminal oracle
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s "-screen 0 1400x900x24" python3 -I -B target/release-tests/kitty_mutation_test.py \
            --kitty "$RUNNER_TEMP/kitty/bin/kitty" \
            --theme "$PWD/target/installed/bin/theme" --output target/kitty-e2e/mutations
      - name: Publish the screenshots, screen dumps and kitty log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kitty-e2e-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/kitty-e2e/
            target/release-tests/manifest.json
          if-no-files-found: error
          retention-days: 30

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 20 # a hung test must cost minutes of feedback, not 6h
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: cargo test --workspace --locked
      # Tapping the checkout is what makes Homebrew judge the formula by its
      # FORMULA rules — a bare path gets generic Ruby cops. `--formula` is
      # load-bearing: the tap IS this repository, and styling it whole turns
      # Homebrew's shell and workflow linters loose on our fixture. Nothing
      # is installed; `brew audit` stays out (see Formula/theme.rb).
      - run: |
          brew trust --formula snaraj/theme/theme
          brew tap snaraj/theme "$GITHUB_WORKSPACE"
          brew style --formula snaraj/theme/theme
      - name: Verify published or prepared downloads and install the reviewed formula
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          python3 -I -B .github/scripts/prepared_release.py homebrew --tests-output target/release-tests
          brew install snaraj/theme/theme
          brew test snaraj/theme/theme
          sh target/release-tests/portable-smoke.sh "$(brew --prefix)/bin/theme"
          python3 -I -B target/release-tests/browser_cli_test.py "$(brew --prefix)/bin/theme"
          python3 -I -B target/release-tests/mdls_cli_test.py "$(brew --prefix)/bin/theme"
          python3 -I -B target/release-tests/preview_cli_test.py "$(brew --prefix)/bin/theme"
      - name: Verify browser commands and terminal layout
        run: |
          cargo install --path . --locked --root target/installed --target-dir target
          sh tests/portable-smoke.sh "$PWD/target/installed/bin/theme"
          python3 -I -B tests/browser_cli_test.py target/installed/bin/theme
          python3 -I -B tests/mdls_cli_test.py target/installed/bin/theme
          python3 -I -B tests/preview_cli_test.py target/installed/bin/theme
          python3 -I -B tests/cli_maintenance_test.py target/installed/bin/theme
      # No real-Kitty step here, and it is not an omission: the hosted macOS
      # VM has no accelerated OpenGL, and GLFW's NSGL backend asks for an
      # accelerated pixel format unconditionally, so the pinned Kitty exits 1
      # on this runner before it can answer — "[glfw error 65545]: NSGL:
      # Failed to find a suitable pixel format", then "Failed to create
      # GLFWwindow ... kitty requires working OpenGL 3.3 drivers" (proven on
      # run 34644677010). The macOS key path is gated by the step above
      # instead: browser_cli_test.py drives the real binary through a real
      # pty, keys, terminal-mode restore and all. The real-Kitty driver runs
      # hosted on Linux (browser-kitty). Physical macOS rendering and desktop
      # Spaces still require a person on a Mac; hosted CI cannot establish them.
      - name: Compare command performance and rendering with the base commit
        env:
          THEME_PERF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.baseline }}
        run: tests/performance-ci.sh
      - name: Publish command timing and rendering evidence
        id: performance_artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: command-performance-${{ runner.os }}-${{ runner.arch }}
          path: target/performance/
          if-no-files-found: error
          retention-days: 30
      - name: Link command evidence in the job summary
        if: ${{ always() && steps.performance_artifact.outputs.artifact-url != '' }}
        env:
          ARTIFACT_URL: ${{ steps.performance_artifact.outputs.artifact-url }}
        run: |
          printf '\n[Download command-performance-%s-%s](%s)\n\nOpen results.json, report.md, and rendering.html inside this downloaded artifact.\n' "$RUNNER_OS" "$RUNNER_ARCH" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  test-linux-distros:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo build --release --locked
      - name: Exercise the glibc build on supported distributions
        run: |
          for distro in ubuntu:22.04 debian:12-slim fedora:latest; do
            printf 'Testing %s\n' "$distro"
            docker run --rm --network=none --read-only --cap-drop=ALL \
              --security-opt=no-new-privileges --user 65534:65534 --tmpfs /tmp \
              -v "$PWD/target/release/theme:/opt/theme:ro" \
              -v "$PWD/tests/portable-smoke.sh:/opt/smoke.sh:ro" \
              "$distro" sh /opt/smoke.sh /opt/theme
          done
      - name: Build and exercise the musl build on Alpine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl
          docker run --rm --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --user 65534:65534 --tmpfs /tmp \
            -v "$PWD/target/x86_64-unknown-linux-musl/release/theme:/opt/theme:ro" \
            -v "$PWD/tests/portable-smoke.sh:/opt/smoke.sh:ro" \
            alpine:3 sh -c '
              sh /opt/smoke.sh /opt/theme
              if /opt/theme update > /tmp/update-output 2>&1; then exit 1; fi
              grep -q "no published release build for this platform" /tmp/update-output
            '

  test-nixos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          enable_kvm: false
          set_as_trusted_user: false
          extra_nix_config: |
            sandbox = true
            system-features = nixos-test benchmark big-parallel kvm
      - name: Allow only the Nix build group to use the VM accelerator
        run: sudo setfacl -m g:nixbld:rw /dev/kvm
      - name: Build, test and boot the NixOS package
        shell: bash
        run: |
          mkdir -p target
          nix-build tests/nixos.nix -o target/nixos-result 2>&1 | tee target/nixos.log
      - name: Retain NixOS build and boot diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nixos-cli
          path: target/nixos.log
          if-no-files-found: error
          retention-days: 30
