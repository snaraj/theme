name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # a hung test must cost minutes of feedback, not 6h
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -I -B tests/release_policy_test.py
      - run: python3 -I -B tests/distribution_test.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The acceptance fixture had never run anywhere but the author's Mac,
      # so nothing pinned the tool END TO END on the platform most of its
      # users are on. It needs both binaries — the update sections drive the
      # debug build's THEME_CURL seam — and costs this job seconds.
      - run: cargo build --release --locked && cargo build --locked && THEME_BIN=target/release/theme tests/boundary.sh
      - name: Compare command performance and rendering with the base commit
        env:
          THEME_PERF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: tests/performance-ci.sh
      - name: Publish command timing and rendering evidence
        id: performance_artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: command-performance-${{ runner.os }}-${{ runner.arch }}
          path: target/performance/
          if-no-files-found: error
          retention-days: 30
      - name: Link command evidence in the job summary
        if: ${{ always() && steps.performance_artifact.outputs.artifact-url != '' }}
        env:
          ARTIFACT_URL: ${{ steps.performance_artifact.outputs.artifact-url }}
        run: |
          printf '\n[Download command-performance-%s-%s](%s)\n\nOpen results.json, report.md, and rendering.html inside this downloaded artifact.\n' "$RUNNER_OS" "$RUNNER_ARCH" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  # The browser's keys, pressed in a terminal that draws. The PTY tests prove
  # the bytes; only a real Kitty proves the whole path — raw mode, the key
  # parser, the redraw and the thumbnails — on a machine that is not the
  # author's. Kitty is pinned by version AND digest, verified before it is
  # extracted, and everything runs headless under Xvfb with software GL.
  browser-kitty:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # a hung terminal must cost minutes, not 6h
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the X server, software GL and the screen capture tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb imagemagick \
            libgl1 libgl1-mesa-dri libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 fonts-dejavu-core libx11-6 libxcb1 libxrandr2 \
            libxi6 libxcursor1 libxinerama1 libwayland-client0 libdbus-1-3 libcanberra0
      - name: Verify the pinned Kitty before extracting it
        env:
          KITTY_VERSION: 0.48.2
          KITTY_SHA256: 967a1958e7fc67b495d279c0963bcd1a0482097151817ce6506fabc822689af7
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kitty.txz" \
            "https://github.com/kovidgoyal/kitty/releases/download/v$KITTY_VERSION/kitty-$KITTY_VERSION-x86_64.txz"
          printf '%s  %s\n' "$KITTY_SHA256" "$RUNNER_TEMP/kitty.txz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/kitty"
          tar -xJf "$RUNNER_TEMP/kitty.txz" -C "$RUNNER_TEMP/kitty"
      - run: cargo build --release --locked
      - name: Press the browser's keys in a real Kitty
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s "-screen 0 1400x900x24" python3 -I -B tests/kitty_e2e.py \
            --kitty "$RUNNER_TEMP/kitty/bin/kitty" \
            --theme target/release/theme --output target/kitty-e2e
      - name: Publish the screenshots, screen dumps and kitty log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kitty-e2e-${{ runner.os }}-${{ runner.arch }}
          path: target/kitty-e2e/
          if-no-files-found: error
          retention-days: 30

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 20 # a hung test must cost minutes of feedback, not 6h
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: cargo test --workspace --locked
      # Tapping the checkout is what makes Homebrew judge the formula by its
      # FORMULA rules — a bare path gets generic Ruby cops. `--formula` is
      # load-bearing: the tap IS this repository, and styling it whole turns
      # Homebrew's shell and workflow linters loose on our fixture. Nothing
      # is installed; `brew audit` stays out (see Formula/theme.rb).
      - run: |
          brew trust --formula snaraj/theme/theme
          brew tap snaraj/theme "$GITHUB_WORKSPACE"
          brew style --formula snaraj/theme/theme
      - name: Verify published downloads and install the reviewed formula
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          python3 -I -B .github/scripts/verify_distribution.py
          brew install snaraj/theme/theme
          brew test snaraj/theme/theme
      - name: Verify browser commands and terminal layout
        run: |
          cargo build --release --locked
          python3 -I -B tests/browser_cli_test.py target/release/theme
          python3 -I -B tests/mdls_cli_test.py target/release/theme
      # The same key path in the same pinned Kitty, on the platform most of
      # this tool's users are on — in the runner's own GUI session, so the
      # window is drawn and captured rather than simulated.
      - name: Press the browser's keys in a real Kitty
        env:
          KITTY_VERSION: 0.48.2
          KITTY_SHA256: f804f58ee4b69c76f84eb3281e140748269a63f3f4a816015a8dec2a06d2b195
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kitty.dmg" \
            "https://github.com/kovidgoyal/kitty/releases/download/v$KITTY_VERSION/kitty-$KITTY_VERSION.dmg"
          printf '%s  %s\n' "$KITTY_SHA256" "$RUNNER_TEMP/kitty.dmg" | shasum -a 256 -c -
          hdiutil attach -nobrowse -readonly -mountpoint /Volumes/kitty "$RUNNER_TEMP/kitty.dmg"
          python3 -I -B tests/kitty_e2e.py \
            --kitty /Volumes/kitty/kitty.app/Contents/MacOS/kitty \
            --theme target/release/theme --output target/kitty-e2e
      - name: Publish the screenshots, screen dumps and kitty log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kitty-e2e-${{ runner.os }}-${{ runner.arch }}
          path: target/kitty-e2e/
          if-no-files-found: error
          retention-days: 30
      - name: Unmount the Kitty image
        if: always()
        run: hdiutil detach /Volumes/kitty || true
      - name: Compare command performance and rendering with the base commit
        env:
          THEME_PERF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: tests/performance-ci.sh
      - name: Publish command timing and rendering evidence
        id: performance_artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: command-performance-${{ runner.os }}-${{ runner.arch }}
          path: target/performance/
          if-no-files-found: error
          retention-days: 30
      - name: Link command evidence in the job summary
        if: ${{ always() && steps.performance_artifact.outputs.artifact-url != '' }}
        env:
          ARTIFACT_URL: ${{ steps.performance_artifact.outputs.artifact-url }}
        run: |
          printf '\n[Download command-performance-%s-%s](%s)\n\nOpen results.json, report.md, and rendering.html inside this downloaded artifact.\n' "$RUNNER_OS" "$RUNNER_ARCH" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
